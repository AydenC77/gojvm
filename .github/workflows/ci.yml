name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: go vet ./...
      - run: go test ./...

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: vscode-gojvm
        run: |
          npm install --no-audit --no-fund
          node --check extension.js
          npx --yes @vscode/vsce package --skip-license --allow-missing-repository -o ../gojvm-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: gojvm-vscode
          path: gojvm-vscode.vsix
